    <!-- Anti-Inspect Protection -->
    <script>
      (function() {
        // 1. Disable right-click context menu
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, true);

        // 2. Block DevTools keyboard shortcuts
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); e.stopPropagation(); return false; }
          // Ctrl+Shift+I / Ctrl+Shift+J / Ctrl+Shift+C
          if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); e.stopPropagation(); return false; }
          // Ctrl+U (view source)
          if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); e.stopPropagation(); return false; }
          // Ctrl+S (save page)
          if (e.ctrlKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); e.stopPropagation(); return false; }
        }, true);

        // 3. DevTools detection via debugger timing trick (reliable, no false positives)
        var _devOpen = false;
        var _overlay = null;
        function showBlocked() {
          if (_devOpen) return;
          _devOpen = true;
          _overlay = document.createElement('div');
          _overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#f0f7ff;font-family:Inter,sans-serif';
          _overlay.innerHTML = '<p style="font-size:18px;font-weight:800;color:#0172B1">Akses dibatasi</p><p style="font-size:13px;color:#6b7280">Tutup developer tools untuk melanjutkan.</p>';
          document.body.appendChild(_overlay);
        }
        function hideBlocked() {
          if (!_devOpen) return;
          _devOpen = false;
          if (_overlay && _overlay.parentNode) _overlay.parentNode.removeChild(_overlay);
          _overlay = null;
        }
        setInterval(function() {
          var start = performance.now();
          (function() { debugger; })();
          var elapsed = performance.now() - start;
          if (elapsed > 80) { showBlocked(); } else { hideBlocked(); }
        }, 1500);

        // 4. Disable drag on images and links
        document.addEventListener('dragstart', function(e) { e.preventDefault(); }, true);

        // 5. Override console to hide debug info
        var noop = function() {};
        var methods = ['log','debug','info','warn','error','group','groupCollapsed','groupEnd','table','trace','dir','dirxml'];
        methods.forEach(function(m) {
          try { console[m] = noop; } catch(ex) {}
        });
      })();
